name: Build and deploy Node.js app to Azure Web App - linkup-ui

on:
  push:
    branches:
      - az-production  # Твоя цільова гілка
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Стабільна версія
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Ми завантажуємо ТІЛЬКИ те, що потрібно для запуску
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist
            package.json
            node_modules
            
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D8F482A3168B4F0ABB4516FEF0D19280 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6252DAFAEA7F4A07AB1206CB1624BDD6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A246F32B99E94B7EA8A1378363DB697F }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'linkup-ui'
          slot-name: 'Production'
          package: .