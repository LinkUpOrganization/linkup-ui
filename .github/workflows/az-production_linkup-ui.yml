# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - linkup-ui

on:
  push:
    branches:
      - az-production
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Використовуємо стабільну LTS версію
          cache: 'npm'

      - name: npm install and build
        run: |
          npm install
          npm run build
          # Ми НЕ запускаємо npm test, щоб уникнути помилки "No test files found"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # Завантажуємо тільки те, що реально потрібно для роботи додатка
          path: |
            dist
            package.json
            node_modules

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Потрібно для авторизації через JWT
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D8F482A3168B4F0ABB4516FEF0D19280 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6252DAFAEA7F4A07AB1206CB1624BDD6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A246F32B99E94B7EA8A1378363DB697F }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'linkup-ui'
          slot-name: 'Production'
          package: .